# ============================================================
# Nginx config for DhanSMM — dhansmm.site
# Copy to: /etc/nginx/sites-available/dhansmm
# Then: ln -s /etc/nginx/sites-available/dhansmm /etc/nginx/sites-enabled/dhansmm
# Then: nginx -t && systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name dhansmm.site www.dhansmm.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name dhansmm.site www.dhansmm.site;

    # ── SSL (filled by certbot automatically) ─────────────────
    ssl_certificate     /etc/letsencrypt/live/dhansmm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhansmm.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API — proxy to Node.js backend ────────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 50m;
    }

    # ── Frontend static files ─────────────────────────────────
    root /var/www/dhansmm/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets with hash in filename forever
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/dhansmm.access.log;
    error_log  /var/log/nginx/dhansmm.error.log;
}
