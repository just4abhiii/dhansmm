<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="dhan-static" content="1"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal Admin | DhanSMM</title><meta name="robots" content="noindex"><meta name="description" content="Legal Admin of DhanSMM"><link rel="icon" href="/favicon.png"><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f8fb;color:#0f1f2e;line-height:1.7}
header{background:#071a2b;color:#fff;padding:16px 20px}header a{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
main{max-width:820px;margin:0 auto;padding:28px 20px 60px}h1{font-size:30px;margin:8px 0}h2{font-size:19px;margin:28px 0 6px}
.box{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:24px}.warn{background:#fff3f3;border:1px solid #f3b4b4;border-radius:10px;padding:12px 14px}
footer{text-align:center;font-size:13px;color:#667;padding:20px}footer a{color:#0b5bd3;margin:0 6px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd6df;border-radius:8px;font:inherit;margin:4px 0 14px}
button{background:#071a2b;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #dde;padding:6px;vertical-align:top;text-align:left}</style></head><body><header><a href="/">DhanSMM</a></header><main><h1>Legal Admin</h1><div class="box"><input id="p" type="password" placeholder="Admin password"><button onclick="load()">Open</button>
<section id="settings" hidden><h2>Signup &amp; Order Legal Declaration</h2><label style="display:flex;align-items:center;gap:14px;cursor:pointer"><input id="consent-toggle" type="checkbox" role="switch" aria-label="Signup and order legal declaration" style="width:32px;height:32px;margin:0" onchange="saveSetting(this)"><strong id="consent-state"></strong></label><p id="settings-note"></p></section><h2>Abuse reports</h2><div id="r"></div><h2>Consent records (latest 300)</h2><div id="c"></div></div>
<script>const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-pass':document.getElementById('p').value,'Content-Type':'application/json'};const r=await fetch(u,o);if(!r.ok)throw new Error('Wrong password');return r.json()}
async function saveSetting(el){el.disabled=true;try{await api("/legal-api/admin/settings",{method:"POST",body:JSON.stringify({enabled:el.checked})});await load()}catch(e){el.checked=!el.checked;alert(e.message)}finally{el.disabled=false}}
async function setS(id,s){await api('/legal-api/admin/status',{method:'POST',body:JSON.stringify({id,status:s})});load()}
async function load(){try{const d=await api('/legal-api/admin/data');document.getElementById('settings').hidden=false;document.getElementById('consent-toggle').checked=d.enabled;document.getElementById('consent-state').textContent=d.enabled?'ON':'OFF';document.getElementById('settings-note').textContent=d.enabled?'Checkbox and English declaration required at signup and order.':'No checkbox or English declaration at signup and order. API key consent remains unchanged.';
document.getElementById('r').innerHTML='<table><tr><th>Time</th><th>Reporter</th><th>Type</th><th>Target</th><th>Suspect</th><th>Details</th><th>IP</th><th>Status</th></tr>'+d.reports.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.reporter_name)}<br>${esc(x.reporter_email)}</td><td>${esc(x.abuse_type)}</td><td>${esc(x.target_link)}</td><td>${esc(x.suspect_info)}</td><td>${esc(x.details)}</td><td>${esc(x.ip)}</td><td>${esc(x.status)}<br><button onclick="setS('${x.id}','resolved')">Resolved</button> <button onclick="setS('${x.id}','blacklisted')">Blacklist</button></td></tr>`).join('')+'</table>';
document.getElementById('c').innerHTML='<table><tr><th>Time</th><th>Event</th><th>Email</th><th>Page</th><th>IP</th><th>Device</th></tr>'+d.consents.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.event)}</td><td>${esc(x.email)}</td><td>${esc(x.page)}</td><td>${esc(x.ip)}</td><td>${esc(x.ua)}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}</script></main><footer><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refunds</a><a href="/report-abuse">Report Abuse</a><br>© 2026 DhanSMM. All rights reserved. | Contact: <a href="mailto:dhansmmofficial@gmail.com">dhansmmofficial@gmail.com</a></footer></body></html>
